# Aucun secret dans ce fichier. Les identifiants viennent de l'identité de service de
# l'hébergement (Application Default Credentials).
spring:
  application:
    name: crimping-pro-api
  main:
    banner-mode: off

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
  tomcat:
    max-http-form-post-size: 64KB
    max-swallow-size: 64KB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  firebase:
    enabled: ${FIREBASE_ENABLED:true}
    project-id: ${FIREBASE_PROJECT_ID:leoni-sertissage-labo}
    database-url: ${FIREBASE_DATABASE_URL:https://leoni-sertissage-labo-default-rtdb.europe-west1.firebasedatabase.app}
  cors:
    # Liste séparée par des virgules, par exemple https://crimping.example.com
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  rate-limit:
    admin-per-minute: ${ADMIN_RATE_PER_MINUTE:30}
    decisions-per-minute: ${DECISION_RATE_PER_MINUTE:60}
  limits:
    # 64 Ko pour les requêtes ordinaires ; 16 Mo pour les décisions sur les bons
    # (photo de coupe et rapport en base64, 7 Mo maximum par fichier).
    default-body-bytes: 65536
    decision-body-bytes: 16777216
  pin:
    # Secret du serveur pour les empreintes de PIN : Secret Manager → variable PIN_PEPPER
    # (32 caractères minimum). Jamais dans ce fichier ni dans le dépôt.
    # Absent : la connexion par PIN est désactivée (le reste de l'API fonctionne).
    pepper: ${PIN_PEPPER:}
    bcrypt-cost: ${PIN_BCRYPT_COST:11}
    session-hours: 12

logging:
  level:
    root: INFO
